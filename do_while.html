<!DOCTYPE html>
<html >
<head>
    <title>pos,neg,zero</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number:"));

do {
    if (num > 0) {
        console.log("Number is Positive");
    } else if (num < 0) {
        console.log("Number is Negative");
    } else {
        console.log("Number is Zero");
    }
} while (false);
    </script>
</body>
</html>
