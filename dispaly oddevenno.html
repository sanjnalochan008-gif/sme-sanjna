<!DOCTYPE html>
<html>
<head>
    <title>Even and Odd Numbers</title>
</head>
<body>
    <h2>Even and Odd Numbers</h2>

    <script>
        for (let i = 1; i <= 100; i++) {
            if (i % 2 == 0) {
                document.write("Even no: " + i + "<br>");
            } else {
                document.write("Odd no: " + i + "<br>");
            }
        }
    </script>
</body>
</html>
