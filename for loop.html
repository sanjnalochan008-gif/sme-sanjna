!DOCTYPE html>

<html>
<body>
<h1>JavaScript Loops</h1>
<h2>The For Loop</h2>

<p id="demo"></p>

<script>
    let num = 3;
    let text = "";

    for (let i = 1; i <= 10; i++) {
        text += num + " * " + i + " = " + (num * i) + "<br>";
    }

    document.getElementById("demo").innerHTML = text;
</script>
