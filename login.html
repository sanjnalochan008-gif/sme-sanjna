<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: white;
            justify-content: center;
            align-items: center;
        }
        form{
            border: 2px solid blue;
            padding: 25px;
            width: 280px;
            border-radius: 0px;
            background-color: orange;
        }
        h2{
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
            color: darkblue;
        }
        label{
            display: block;
            margin-bottom: 5px;
            font-weight:bold;
            color: black;
        }
        input[type="text"]{
            width: 100%;
            padding: 6px;
            margin-bottom: 15px;
            border: 1px solid black;
            border-radius: 0px;
            box-sizing: border-box;
            background-color: white;
        }
    </style>
</head>
<body>
    <form>
        <h2>login</h2>
        <label>Roll no.:</label>
        <input type="text"
        name="roll no.">
        <br><br>

        <label>Name:</label>
        <input type="text"
        name="username">
        <br><br>

        <label>Contact no.:</label>
        <input type="text"
        name="contact no.">
        <br><br>

        <label>Course:</label>
        <input type="text"
        name="course">
        <br><br>


        <label>Semester:</label>
        <input type="text"
        name="semester">
        <br><br>
<input type="submit" value="Login">
<input type="reset" value="clear">

        
    </form>
    
</body>
</html>
