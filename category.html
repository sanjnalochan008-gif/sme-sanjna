<!DOCTYPE html>
<html>
<head>
    <title>valid invalid age</title>
</head>
<body>

<script>

let age = 20;

if (age < 0) {
    document.write("Invalid age");
}
else if (age < 13) {
    document.write("Child");
}
else if (age <= 19) {
    document.write("Teenage");
}
else {
    document.write("Adult");
}
</script>
</body>
</html>
